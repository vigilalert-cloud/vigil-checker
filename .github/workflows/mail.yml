name: Vigil verification emails
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vigil-mail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Send pending verification codes
        env:
          VIGIL_API: ${{ secrets.VIGIL_API }}
          CHECKER_SECRET: ${{ secrets.CHECKER_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER_2: ${{ secrets.GMAIL_USER_2 }}
          GMAIL_APP_PASSWORD_2: ${{ secrets.GMAIL_APP_PASSWORD_2 }}

        run: python checker/checker.py --mail-only
